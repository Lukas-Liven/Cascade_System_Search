[project]
name = "cascade-research-tool"
version = "0.1.0"
description = "Tkinter research application for identifying and visualizing dam cascading systems."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiohttp>=3.9,<4",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "geopandas>=0.14.0",
    "pynhd>=0.19.0",
    "pygeohydro>=0.19.0",
    "networkx>=3.2.0",
    "folium>=0.16.0",
]

[tool.uv]
package = false
